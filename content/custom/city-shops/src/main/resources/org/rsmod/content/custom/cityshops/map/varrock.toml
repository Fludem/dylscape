# Varrock's shopkeepers, at their OSRS spawn tiles.
#
# Two of the wired npcs are deliberately absent. `aubury_3op` is the post-Rune Mysteries Aubury
# whose third op teleports to the essence mine -- there is no mine to teleport to, so the pre-quest
# `aubury_2op` is the one that stands in the shop. `thessalia_league` is the Leagues variant.
# Both stay bound in `ShopAssignments` so they trade if something ever spawns them.

