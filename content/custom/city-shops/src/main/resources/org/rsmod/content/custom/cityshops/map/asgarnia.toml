# General stores across Asgarnia. Each town's keeper/assistant pair opens the matching
# `generalshopN` inv, so the town a store belongs to is decided here, by where its staff stand.

# Falador general store (2958, 3387).
[[spawn]]
npc = 'generalshopkeeper3'
coords = '0_46_52_14_59'

[[spawn]]
npc = 'generalassistant3'
coords = '0_46_52_14_60'

# Edgeville general store, behind the counter at (3080, 3511) and (3081, 3511). The wiki marks
# this shop at (3080, 3510), which is the counter itself; both staff used to sit south of it, on
# the customer's side, because that was the nearest standable tile once `world-spawns` had already
# taken the two north of it with a duplicate pair that opened no shop. Those are gone, so they now
# stand where vanilla puts them. Primula shares this counter -- see `misthalin.toml`.
[[spawn]]
npc = 'generalshopkeeper6'
coords = '0_48_54_8_55'

[[spawn]]
npc = 'generalassistant6'
coords = '0_48_54_9_55'

