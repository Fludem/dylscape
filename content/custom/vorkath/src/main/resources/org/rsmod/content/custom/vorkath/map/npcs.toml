# Vorkath and the ferryman who gets you to it.
#
# Coordinates are `level_msqX_msqZ_localX_localZ`. Every one of them is mirrored in
# `VorkathArena` and `VorkathArenaTest` checks the two agree and that the tiles are real.
#
# Spawns only reach the cache through `./gradlew packCache` with the server stopped, or the live
# server's own first-boot pack. A normal boot will not place them.

