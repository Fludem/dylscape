# Tutorial Island instructor spawns.
#
# Every tile below was read out of the cache rather than guessed: the island's collision map and its
# loc set (doors, ladders, the range, the furnace, the anvils, the ore rocks, the bank booths and the
# altar) pin each room exactly, and each instructor is placed on an open, standable tile inside the
# room whose lesson they teach. `TutorialMapTest` asserts that back, so a bad tile fails the build
# rather than stranding a new account.
#
# Two of them are underground. The mining cave sits at the usual `+6400` z offset beneath the island
# -- mapsquare 48_148 -- and holds the mining, smelting, smithing and combat steps; the ladder down
# is in the Quest Guide's house at 3088,3119.
#
# `npc` values are the rev 233 cache symbol names.

# --- Surface -----------------------------------------------------------------------------------

# 3094,3110 -- the Gielinor Guide's room, north of where a new account is placed (3094,3107).
[[spawn]]
npc = 'newbie_basics_instructor'
coords = '0_48_48_22_38'

# 3103,3095 -- the clearing by the pond, beside the trees the player chops and the spots they fish.
[[spawn]]
npc = 'newbie_survival_instructor'
coords = '0_48_48_31_23'

# 3075,3083 -- the kitchen, next to the range at 3075,3081.
[[spawn]]
npc = 'newbie_cook_instructor'
coords = '0_48_48_3_11'

# 3086,3123 -- the trophy house, by the ladder down to the mining cave at 3088,3119.
[[spawn]]
npc = 'newbie_quest_instructor'
coords = '0_48_48_14_51'

# 3127,3123 -- the small room east of the bank, through the door at 3125,3124.
[[spawn]]
npc = 'newbie_account_instructor'
coords = '0_48_48_55_51'

# 3140,3089 -- the wizard's building in the south-east, inside the ring of magical symbols.
[[spawn]]
npc = 'newbie_magic_instructor'
coords = '0_49_48_4_17'

