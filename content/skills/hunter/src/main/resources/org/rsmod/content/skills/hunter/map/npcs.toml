# Huntable creatures, placed in their real OSRS hunting grounds.
#
# Coords are `level_mapsquareX_mapsquareZ_localX_localZ`, i.e. `abs / 64` and `abs % 64`.
#
# ---------------------------------------------------------------------------------------------
# UNVERIFIED: these tiles are the real OSRS hunting areas by absolute coordinate, but they have
# not been walked in-game on this server. Before trusting them, `::tele` to each ground and check
# with `::mypos` that the creatures are standing on open, reachable ground rather than inside
# scenery or off the edge of a built region. This is the same check that had to be done for the
# Tutorial Island instructor tiles.
#
# Remember: nothing here exists until `./gradlew packCache` runs with the server stopped. The
# boot-time config sync applies the npc *edits* (wander ranges, hunt modes, catch params) but
# never map resources.
# ---------------------------------------------------------------------------------------------
#
# Bird snaring is spread across all four biomes so the 1-11 stretch is not stuck in one place.
# Box trapping is the Piscatoris chinchompas plus the ferrets that share the ground.
# Net trapping needs `hunting_sapling_up_*` young trees, and deadfall needs
# `hunting_deadfall_boulder`, both of which are *map scenery* rather than anything placed here --
# if a ground turns out to be bare, the creatures below have nothing to be caught in.

# --- Feldip Hills (jungle): crimson swifts, the very first thing a new hunter catches ---
