# Pickpocket targets for the mid and high tiers of the Thieving ladder.
#
# Levels 1 and 10 need nothing: `LumbridgeNpcSpawns` already places five `man`, four `man3`, three
# `woman` and three `farmer1`, so a new account can start thieving where it logs in.
#
# Everything above that is placed here, in two clusters chosen so a player trains in one spot rather
# than running a circuit:
#
#   Varrock (levels 25-40) -- warriors, rogues and guards, all at their real OSRS locations.
#   East Ardougne market (levels 55-80) -- knights, paladins and heroes, also real OSRS locations,
#     and deliberately the same square as the six `*thiefstall` locs the cache already has standing
#     there. That makes one hub where both halves of the skill are reachable without moving.
#
# The one deviation is the Yanille watchman at level 65. Yanille is a long walk south of Ardougne
# for a single rung of the ladder, so it stands in the Ardougne market with the rest. Left as a
# knowing choice, not an error -- moving it back to Yanille is fine if the walk is wanted.
#
# Master farmers go in Draynor, where they belong.
#
# Coords are `level_mapsquareX_mapsquareZ_localX_localZ`, i.e. `abs / 64` and `abs % 64`.
# NOTE: this file is only read by `./gradlew packCache` with the server stopped. It is inert at boot.

